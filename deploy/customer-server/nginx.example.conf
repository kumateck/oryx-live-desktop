# Generated from customer-owned configuration. Re-render after changing backend or site origins.
map $http_upgrade $oryx_connection_upgrade { default upgrade; "" close; }
server {
  listen 80;
  server_name oryx.customer.local;
  
  root /srv/oryx/current;
  client_max_body_size 100m;

  location /api/ {
    proxy_pass http://127.0.0.1:8086;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_read_timeout 300s;
  }
  location /realtime/ {
    return 503;
  }
  location /assets/ {
    root /srv/oryx/shared;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /viewers/ {
    root /srv/oryx/shared;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }
  location = /deployment.json { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location ~ /\. { deny all; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache" always; }
}
