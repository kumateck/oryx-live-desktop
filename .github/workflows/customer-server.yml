name: Validate customer server release
on:
  push:
    branches: [entrance-server]
  pull_request:
    branches: [entrance-server]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: customer-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: bun run check
        env:
          CI: "1"
          NODE_OPTIONS: --max-old-space-size=6144
      - run: bun run build:web
      - name: Check release compatibility manifest against the checked-in API contract
        run: node deploy/customer-server/check-release.ts
      - name: Validate customer Nginx configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          node deploy/customer-server/check-nginx.ts
          sudo nginx -t -c /tmp/oryx-customer-nginx.conf
      - name: Verify installation and systemd units on the disposable runner
        run: |
          sudo install -d -m 0750 /etc/oryx-deploy
          sudo install -m 0640 deploy/customer-server/customer.env.example /etc/oryx-deploy/customer.env
          sudo "$(command -v node)" deploy/customer-server/install.ts
          sudo systemd-analyze verify /etc/systemd/system/oryx-deploy.service /etc/systemd/system/oryx-deploy.timer
          sudo -H -u oryx-deploy "$(command -v node)" /opt/oryx/deploy-agent/cli.ts status
          sudo "$(command -v node)" /opt/oryx/deploy-agent/uninstall.ts
          test -f /etc/oryx-deploy/customer.env
          test -f /etc/nginx/sites-available/oryx-customer
