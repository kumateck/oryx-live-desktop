name: Customer release pipeline
on:
  push:
    branches: [entrance-server]
  pull_request:
    branches: [entrance-server]
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build and smoke-test the Windows installer after release validation
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: customer-release
  cancel-in-progress: false
jobs:
  web:
    name: Validate customer release
    if: (github.event_name == 'pull_request' && github.base_ref == 'entrance-server') || github.ref == 'refs/heads/entrance-server'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Run the same complete release validation as pre-push
        run: node scripts/customer-release-validation.ts --sha "${{ github.sha }}"

  windows-installer:
    name: Build Windows installer
    needs: web
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/entrance-server' && inputs.build_windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ORYX_DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.ORYX_DESKTOP_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Validate desktop update signing configuration
        id: signing
        env:
          ORYX_DESKTOP_UPDATE_PRIVATE_KEY: ${{ secrets.ORYX_DESKTOP_UPDATE_PRIVATE_KEY }}
        run: bun scripts/check-desktop-signing.ts
      - name: Check the desktop shell
        run: |
          bun run --filter @oryx/desktop test
          bun run --filter @oryx/desktop typecheck
      - name: Build the main Windows x86 and x64 NSIS installer
        run: bun run --filter @oryx/desktop make:windows
      - name: Verify and collect the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item 'apps/desktop/out/make/nsis/OryxLiveDesktop-Setup.exe'
          if ($installer.Length -lt 1MB) { throw 'The installer is missing or unexpectedly small.' }
          $header = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) { throw 'The installer is not a Windows executable.' }
          # NSIS itself is a 32-bit bootstrapper; both embedded application payloads must be present.
          foreach ($target in @(@{ Folder='win-ia32-unpacked'; Machine=0x14c }, @{ Folder='win-unpacked'; Machine=0x8664 })) {
            $path = Join-Path 'apps/desktop/out/make/nsis' ($target.Folder + '/OryxLiveDesktop.exe')
            $app = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
            $pe = [BitConverter]::ToInt32($app, 0x3c)
            if ([BitConverter]::ToUInt32($app, $pe) -ne 0x4550 -or [BitConverter]::ToUInt16($app, $pe + 4) -ne $target.Machine) { throw "Wrong application architecture: $path" }
          }
          New-Item -ItemType Directory downloads -Force | Out-Null
          Copy-Item $installer.FullName 'downloads/OryxLiveDesktop-Setup.exe'
          $hash = (Get-FileHash 'downloads/OryxLiveDesktop-Setup.exe' -Algorithm SHA256).Hash
          "Installer SHA256: $hash"
          "Windows x86 + x64 installer from commit $env:GITHUB_SHA`n`nSHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Install and launch on the disposable Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Start-Process (Resolve-Path downloads/OryxLiveDesktop-Setup.exe) -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          Start-Sleep 3
          Get-Process OryxLiveDesktop -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter OryxLiveDesktop.exe | Select-Object -First 1
          if (-not $exe) { throw 'The installer did not install OryxLiveDesktop.exe' }
          "Installed: $($exe.FullName)"
          $shortcuts = @((Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Oryx Live Desktop.lnk'), (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Oryx Live Desktop.lnk'))
          foreach ($link in $shortcuts) { if (-not (Test-Path $link)) { throw "Missing shortcut: $link" }; "Shortcut: $link" }
          New-Item -ItemType Directory shots -Force | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          # The companion is a second window of the same process, so read every top-level title instead of
          # Process.MainWindowTitle, which picks one of them arbitrarily.
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class OryxWindows {
            [DllImport("user32.dll")] private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr extra);
            [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr window, out uint process);
            [DllImport("user32.dll")] private static extern int GetWindowText(IntPtr window, StringBuilder text, int max);
            [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr window);
            private delegate bool EnumWindowsProc(IntPtr window, IntPtr extra);
            public static string[] Titles(int[] processes) {
              var wanted = new HashSet<int>(processes);
              var titles = new List<string>();
              EnumWindows((window, extra) => {
                uint owner;
                GetWindowThreadProcessId(window, out owner);
                if (wanted.Contains((int)owner) && IsWindowVisible(window)) {
                  var text = new StringBuilder(512);
                  GetWindowText(window, text, text.Capacity);
                  if (text.Length > 0) titles.Add(text.ToString());
                }
                return true;
              }, IntPtr.Zero);
              return titles.ToArray();
            }
          }
          '@
          function Launch([string] $name, [scriptblock] $ok) {
            Start-Process $exe.FullName | Out-Null
            Start-Sleep 20
            $running = @(Get-Process OryxLiveDesktop -ErrorAction SilentlyContinue)
            $titles = if ($running) { [OryxWindows]::Titles([int[]] @($running | ForEach-Object { $_.Id })) } else { @() }
            try {
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save("shots/$name.png")
            } catch { "Screenshot failed: $_" }
            Get-Process OryxLiveDesktop -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            if (-not $titles) { throw "${name}: the app shows no window" }
            $shown = $titles -join ' | '
            "${name}: windows $shown"
            if (-not (& $ok $titles)) { throw "${name}: unexpected windows $shown" }
          }
          $config = Join-Path $env:APPDATA 'Oryx Live Desktop'
          if (Test-Path $config) { Remove-Item $config -Recurse -Force }
          Launch 'first-launch' { param($titles) ($titles -contains 'Connect to Oryx') -and ($titles -contains 'ORYX Companion') }
          $installedExe = $exe
          $exe = Get-Item 'apps/desktop/out/make/nsis/win-ia32-unpacked/OryxLiveDesktop.exe'
          Launch 'x86-runtime' { param($titles) ($titles -contains 'Connect to Oryx') -and ($titles -contains 'ORYX Companion') }
          $exe = $installedExe
          $config = Join-Path $env:APPDATA 'Oryx Live Desktop'
          New-Item -ItemType Directory $config -Force | Out-Null
          $fixture = Start-Process node -ArgumentList 'scripts/windows-installer-site.ts' -RedirectStandardOutput 'shots/site.log' -RedirectStandardError 'shots/site-error.log' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($fixture.HasExited) { throw 'The local port 3001 fixture exited; inspect the smoke logs.' }
              try { $ready = (Invoke-WebRequest 'http://127.0.0.1:3001' -TimeoutSec 2).StatusCode -eq 200 } catch { }
              if ($ready) { break }
              Start-Sleep 1
            }
            if (-not $ready) { throw 'The local port 3001 fixture did not start.' }
            Set-Content -NoNewline -Path (Join-Path $config 'site-url.txt') -Value 'http://127.0.0.1:3001'
            Launch 'connected' { param($titles) ($titles -contains 'Oryx installer smoke site') -and ($titles -contains 'ORYX Companion') }
          } finally {
            Get-Process OryxLiveDesktop -ErrorAction SilentlyContinue | Stop-Process -Force
            if (-not $fixture.HasExited) { Stop-Process -Id $fixture.Id -Force }
          }
      - name: Verify an installed desktop upgrade using disposable signing keys
        shell: pwsh
        run: |
          bun scripts/windows-update-smoke.ts 2>&1 | Tee-Object -FilePath 'shots/update-smoke.log'
          if ($LASTEXITCODE -ne 0) { throw 'The installed desktop update smoke failed. See update-smoke.log.' }
      - name: Prepare the signed in-app update bundle
        if: steps.signing.outputs.configured == 'true'
        env:
          ORYX_DESKTOP_UPDATE_PRIVATE_KEY: ${{ secrets.ORYX_DESKTOP_UPDATE_PRIVATE_KEY }}
        run: bun scripts/create-desktop-update.ts publish downloads/OryxLiveDesktop-Setup.exe desktop-update
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: oryx-live-desktop-update
          path: desktop-update/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oryx-live-windows-smoke
          path: shots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: oryx-live-windows-installer
          path: downloads/OryxLiveDesktop-Setup.exe
          if-no-files-found: error
          retention-days: 30
