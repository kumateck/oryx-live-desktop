name: Deploy testing site

# Builds the web app and notification gateway images and the Windows installer from the testing branch,
# and runs them on the shared server beside oryx-next. See docs/deployment.md.
on:
  push:
    branches: [testing]
  workflow_dispatch:

concurrency:
  group: deploy-testing
  cancel-in-progress: false

env:
  # GitHub's registry, so no separate registry account is needed; the workflow's own token pushes and pulls.
  WEB_IMAGE: ghcr.io/kumateck/oryx-live-web
  GATEWAY_IMAGE: ghcr.io/kumateck/oryx-live-gateway
  WEB_CONTAINER: oryx-live-web
  GATEWAY_CONTAINER: oryx-live-gateway
  HOST_PORT: "3011"
  SITE_ORIGIN: http://164.90.142.68:3011
  API_ORIGIN: http://164.90.142.68:8086

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: bun run check
        env:
          # The web typecheck needs more than Node's default heap on a runner.
          NODE_OPTIONS: --max-old-space-size=6144

  images:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }},${{ env.WEB_IMAGE }}:testing
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: gateway
          push: true
          tags: ${{ env.GATEWAY_IMAGE }}:${{ github.sha }},${{ env.GATEWAY_IMAGE }}:testing
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      packages: read
    steps:
      - name: Run the containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Valid only while this job runs; the server signs out of the registry once it has pulled.
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: REGISTRY_USER,REGISTRY_TOKEN,RABBITMQ_HOST,RABBITMQ_PASS,TAG
          script: |
            set -e
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
            docker pull "${{ env.WEB_IMAGE }}:$TAG"
            docker pull "${{ env.GATEWAY_IMAGE }}:$TAG"
            docker logout ghcr.io
            docker network inspect sail >/dev/null 2>&1 || docker network create sail
            mkdir -p "$HOME/oryx-live/downloads"

            docker rm -f "${{ env.GATEWAY_CONTAINER }}" >/dev/null 2>&1 || true
            docker run -d --init --restart always --net sail \
              --add-host host.docker.internal:host-gateway \
              --name "${{ env.GATEWAY_CONTAINER }}" \
              --env ORYX_API_ORIGIN="${{ env.API_ORIGIN }}" \
              --env ORYX_GATEWAY_ALLOWED_ORIGINS="${{ env.SITE_ORIGIN }}" \
              --env ORYX_GATEWAY_ALLOW_INSECURE=1 \
              --env RABBITMQ_HOST="$RABBITMQ_HOST" \
              --env RABBITMQ_DEFAULT_USER=root \
              --env RABBITMQ_DEFAULT_PASS="$RABBITMQ_PASS" \
              "${{ env.GATEWAY_IMAGE }}:$TAG"

            docker rm -f "${{ env.WEB_CONTAINER }}" >/dev/null 2>&1 || true
            docker run -d --restart always --net sail \
              --add-host host.docker.internal:host-gateway \
              -p "${{ env.HOST_PORT }}:80" \
              --name "${{ env.WEB_CONTAINER }}" \
              --env ORYX_API_ORIGIN="${{ env.API_ORIGIN }}" \
              --env ORYX_GATEWAY_UPSTREAM="${{ env.GATEWAY_CONTAINER }}:4100" \
              --volume "$HOME/oryx-live/downloads:/srv/downloads:ro" \
              "${{ env.WEB_IMAGE }}:$TAG"

            sleep 3
            docker ps --filter "name=oryx-live" --format '{{.Names}} {{.Status}}'
            docker image prune -f

            # What the site can reach. Prints only names, networks, ports and HTTP status lines.
            set +e
            echo "== containers publishing the backend and broker ports"
            docker ps --filter publish=8086 --format '8086: {{.Names}} on {{.Networks}} ({{.Ports}})'
            docker ps --filter publish=5672 --format '5672: {{.Names}} on {{.Networks}} ({{.Ports}})'
            docker ps --format '{{.Names}} on {{.Networks}}' | grep -iE 'rabbit|backend|api|oryx' | grep -v oryx-live
            for target in "${{ env.API_ORIGIN }}" http://host.docker.internal:8086; do
              echo "== web container to $target"
              docker exec "${{ env.WEB_CONTAINER }}" wget -q -S -O /dev/null -T 8 "$target/api/v1/user/authenticated" 2>&1 | grep -m1 HTTP || echo "no answer"
            done
            echo "== through the site"
            curl -s -o /dev/null -m 15 -w "%{http_code}\n" "http://127.0.0.1:${{ env.HOST_PORT }}/api/v1/user/authenticated"
            sleep 5
            echo "== gateway"
            docker logs --tail 6 "${{ env.GATEWAY_CONTAINER }}" 2>&1
            command -v ufw >/dev/null && ufw status 2>/dev/null | head -25
            exit 0

  installer:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build the installer (NSIS)
        run: bun run --filter @oryx/desktop make:windows
      - name: Name the installer
        shell: bash
        run: |
          mkdir -p downloads
          cp apps/desktop/out/make/nsis/OryxLiveDesktop-Setup.exe downloads/
      # Installs as a tester would, then opens the app twice: fresh (the connection page) and pointed at the site.
      - name: Install and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process (Resolve-Path downloads/OryxLiveDesktop-Setup.exe) -ArgumentList '/S' -Wait
          Start-Sleep 3
          Get-Process OryxLiveDesktop -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter OryxLiveDesktop.exe | Select-Object -First 1
          if (-not $exe) { throw 'The installer did not install OryxLiveDesktop.exe' }
          "Installed: $($exe.FullName)"
          $shortcuts = @((Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Oryx Live Desktop.lnk'), (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Oryx Live Desktop.lnk'))
          foreach ($link in $shortcuts) { if (-not (Test-Path $link)) { throw "Missing shortcut: $link" }; "Shortcut: $link" }
          New-Item -ItemType Directory shots -Force | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Launch([string] $name, [scriptblock] $ok) {
            Start-Process $exe.FullName | Out-Null
            Start-Sleep 20
            $window = Get-Process OryxLiveDesktop -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | Select-Object -First 1
            try {
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save("shots/$name.png")
            } catch { "Screenshot failed: $_" }
            Get-Process OryxLiveDesktop -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            if (-not $window) { throw "${name}: the app shows no window" }
            "${name}: window titled '$($window.MainWindowTitle)'"
            if (-not (& $ok $window.MainWindowTitle)) { throw "${name}: unexpected window '$($window.MainWindowTitle)'" }
          }
          Launch 'first-launch' { param($title) $title -eq 'Connect to Oryx' }
          $config = Join-Path $env:APPDATA 'Oryx Live Desktop'
          New-Item -ItemType Directory $config -Force | Out-Null
          Set-Content -NoNewline -Path (Join-Path $config 'site-url.txt') -Value '${{ env.SITE_ORIGIN }}'
          Launch 'connected' { param($title) $title -ne 'Connect to Oryx' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-launch-screenshots
          path: shots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: downloads/OryxLiveDesktop-Setup.exe
          retention-days: 14

  publish-installer:
    runs-on: ubuntu-latest
    needs: [installer, deploy]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: downloads
      - name: Copy it to the site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: downloads/OryxLiveDesktop-Setup.exe
          target: oryx-live
