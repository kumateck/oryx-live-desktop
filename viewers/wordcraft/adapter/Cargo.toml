[package]
name = "dodo-wordcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
wordcraft-engine = { path = "../wordcraft-source/crates/engine" }
wordcraft-ui-egui = { path = "../wordcraft-source/crates/ui-egui" }
eframe = { version = "=0.36.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = "=0.36.0"
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element"] }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
strip = true

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }
