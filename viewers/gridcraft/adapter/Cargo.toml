[package]
name = "dodo-gridcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
gridcraft-engine = { path = "../gridcraft-source/crates/engine" }
gridcraft-ui-egui = { path = "../gridcraft-source/crates/ui-egui" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = "=0.36.2"
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element"] }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
strip = true
